name: Pytest

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.versions }} versions
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        versions: [latest, floor]
        include:
          # the ranges in isschecker_env.yml, solved fresh
          - versions: latest
            environment-file: isschecker_env.yml
          # every floor in isschecker_env.yml pinned exactly
          - versions: floor
            environment-file: ci/isschecker_env_floor.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ matrix.environment-file }}
          environment-name: isschecker
          # Caching a solved environment would hide the day a new release
          # breaks the open end of a range, so only the floor -- which is
          # pinned, and so cannot drift -- is cached.
          cache-environment: ${{ matrix.versions == 'floor' }}
          cache-downloads: true
          init-shell: >-
            bash

      - name: Install isschecker
        shell: micromamba-shell {0}
        # The same flags the README gives modelers, so CI exercises the
        # documented install rather than a different one.
        run: python -m pip install --no-deps --no-build-isolation .

      - name: Report the installed versions
        shell: micromamba-shell {0}
        run: micromamba list

      - name: Check the entry points
        shell: micromamba-shell {0}
        working-directory: ${{ runner.temp }}
        run: |
          ismip7-compliance-checker --version
          python -m isschecker --version
          ismip7-generate-test-files --list-grids

      - name: Run test suite
        shell: micromamba-shell {0}
        # Run from outside the checkout so the tests import the installed
        # package: a data file or entry point that did not make it into the
        # wheel then fails here instead of passing against the source tree.
        working-directory: ${{ runner.temp }}
        # The whole directory, not one file: test_golden_log.py exists to catch
        # a dependency release inside the supported ranges changing the log, and
        # that is exactly what running it here at both the floor and the latest
        # environment is for.
        run: pytest -v "$GITHUB_WORKSPACE/tests"
